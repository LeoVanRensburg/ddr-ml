# @package _global_

hpo:
  enable: true
  study_name: ddr_search
  direction: maximize
  storage: sqlite:///./optunahpo.db
  n_trials: 50
  n_jobs: 1

  # Optional sampler (mirrors your old TPESampler setup)
  sampler:
    name: tpe
    multivariate: true
    seed: 42

  # Optional: stop optimization if too many failed trials (see code patch below)
  max_failure_rate: 0.2         # same meaning as before (fraction)
  fail_on_error: true           # make trial FAIL if your training raises

  params:
    - {name: "optim.lr",                    type: "float", low: 1e-6,  high: 1e-3,  log: true}
    - {name: "optim.weight_decay",          type: "float", low: 1e-5,  high: 1e-2,  log: true}
    - {name: "optim.type",                  type: "categorical", choices: ["adamw", "adamp"]}
    - {name: "scheduler.warmup_epochs",     type: "int",   low: 0,     high: 9,     step: 1}
    - {name: "loss.gamma_neg",              type: "float", low: 2.0,   high: 4.0}
    - {name: "mixup_cutmix.mixup_alpha",    type: "float", low: 0.2,   high: 0.6}
    - {name: "mixup_cutmix.cutmix_alpha",   type: "float", low: 0.2,   high: 0.6}
    - {name: "mixup_cutmix.switch_epoch",   type: "float", low: 0.4,   high: 0.8}
    - {name: "model.drop_path_rate",        type: "float", low: 0.0,   high: 0.1}
    - {name: "data.img_sz",                 type: "categorical", choices: [448, 512, 600]}

# Checkpointing is handled by train.py’s hashed dir. You can keep your own base.
checkpoint:
  base_dir: checkpoints
  resume: auto
  save_heavy_every: 0